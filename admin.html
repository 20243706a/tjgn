<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상담">
<meta name="theme-color" content="#2E6B6F">
<link rel="manifest" href="/manifest-admin.json">
<link rel="stylesheet" href="/style.css">
<title>상담사용</title>
</head>
<body>
<button id="fs" class="fs" hidden></button>
<div id="apop" class="pop" hidden></div>
<main id="app" class="wide"></main>
<script src="/common.js"></script>
<script>
document.querySelector('link[rel=manifest]').href='/manifest-admin.json?admin='+encodeURIComponent(new URLSearchParams(location.search).get('admin')||'');
var ST=[
{t:'시작',act:'친구 화면은 대기 중이에요.',say:['편한 데서 얘기하자. 말하기 싫은 건 안 해도 돼.','시간 괜찮아? 30분쯤 해볼까?']},
{t:'있었던 일 듣기',act:'친구 화면에 입력칸이 열렸어요. 친구가 적는 대로 아래 기록에 채워져요.',say:['다 적었어? 읽어줄래, 내가 읽어도 돼?','응, 계속 말해.','그래서 어떻게 됐어?'],note:'있었던 일 핵심'},
{t:'그때 기분',act:'입력칸과 감정 버튼이 열렸어요. 고른 감정을 그대로 되받아요.',say:['그때 기분은 어땠어?','{감정}… 그렇게 느낄 만해.'],note:'고른 감정'},
{t:'기분의 크기',act:'친구 화면에 점수 슬라이더가 열렸어요.',say:['지금도 그 정도야?'],q:'그 점수를 준 이유가 뭐야?',note:'점수와 이유'},
{t:'더 듣기',act:'아래 질문 7개는 눌러야 친구 화면에 떠요. 2~3개만 이어가요.',say:QS,bank:1,note:'새로 알게 된 것'},
{t:'요약 확인',act:'들은 걸 정리해서 말하면, 친구가 맞는지 눌러요.',say:['내가 들은 건 이거야. 이게 맞아?'],q:'내가 놓친 거 있어?',note:'요약',crisis:1},
{t:'필요한 것',act:'친구 화면에 필요한 것 버튼이 열렸어요.',say:[],q:'지금은 그냥 들어줄까, 같이 방법 찾아볼까?',note:'친구가 한 말'},
{t:'작은 방법',act:'방법 버튼이 열렸어요. 방법은 친구가 고르게 해요.',say:['이건 어때? 오늘은 일찍 자는 것부터.','내가 도울 수 있는 건 뭐가 있을까?'],q:'오늘 할 수 있는 거 하나만 고르면 뭐야?',note:'고른 것'},
{t:'마무리',act:'친구 화면에 정리가 떠요. 같이 봐요.',say:['얘기해줘서 좋았어.','며칠 뒤에 어떻게 지내는지 물어봐도 될까?'],date:1}
];

var C={cstep:0,msg:'',notes:{},crisis:false,date:'',draft:'',popid:0,popOpen:false,touched:{}},R={};
var PRE=['천천히 해도 돼','잠깐 쉬어도 돼','말하기 싫으면 건너뛰어도 돼','물 한 모금 마실까?'];
function popPre(k){C.draft=PRE[k];$('pd').value=C.draft}
function popSend(){var t=(C.draft||'').trim();if(!t)return;C.popid=Math.max(C.popid,R.popid||0)+1;patch({pop:t,popid:C.popid});C.draft='';$('pd').value=''}
function popClose(){patch({pop:''})}
function fill(t){return t.replace('{감정}',((R.moods||[]).map(strip).join('·'))||'힘들었구나')}
function enter(i){C.cstep=Math.max(0,Math.min(ST.length,i));var q=(ST[C.cstep]&&ST[C.cstep].q)||'';C.msg=q;patch({cstep:C.cstep,msg:q,fdone:false});crender();scrollTo(0,0)}
function cgo(d){enter(C.cstep+d)}
function send(i){var t=fill(ST[C.cstep].say[i]);C.msg=(C.msg===t)?'':t;patch({msg:C.msg});crender()}
function clr(){C.msg='';patch({msg:''});crender()}
function live(){
  var on=(R.online||{}).f>0,o='<div class="live"><div><small>친구 화면</small><span class="'+(on?'on':'')+'">'+(on?'연결됨':'아직 안 들어옴')+'</span>'+(R.fdone?' · ✓ 다 했어':'')+'</div>'
   +'<div class="lk"><small>친구에게 보낼 링크</small><span>'+esc(location.origin+'/')+'</span><button class="mini" onclick="cp()">복사</button></div>';
  if(R.pop)o+='<div><small>팝업</small>'+esc(R.pop)+'<br><span class="on">'+(R.popack&&R.popack===R.popid?'친구가 확인함':'표시 중')+'</span></div>';
  if(R.what)o+='<div><small>있었던 일</small>'+esc(R.what)+'</div>';
  if(R.feel||(R.moods||[]).length)o+='<div><small>그때 기분</small>'+esc(R.feel||'')+((R.moods||[]).length?'\n'+R.moods.map(strip).join(', '):'')+'</div>';
  if(C.cstep>=3)o+='<div><small>기분의 크기</small>'+(R.level==null?5:R.level)+'/10</div>';
  if(R.think)o+='<div><small>떠오른 생각</small>'+esc(R.think)+'</div>';
  if((R.agree||[]).length)o+='<div><small>요약이 맞는지</small>'+R.agree[0]+'</div>';
  if((R.needs||[]).length)o+='<div><small>필요한 것</small>'+R.needs.join(', ')+'</div>';
  if(R.custom||(R.acts||[])[0])o+='<div><small>오늘 해볼 것</small>'+esc(R.custom||R.acts[0])+'</div>';
  return o+'</div>';
}
function jump(i){enter(i)}
function ftext(i){
  if(i==1)return R.what||'';
  if(i==2)return [R.feel||'',(R.moods||[]).map(strip).join(', ')].filter(Boolean).join('\n');
  if(i==3)return R.level==null?'':R.level+'/10';
  if(i==4)return R.think||'';
  if(i==5)return (R.agree||[])[0]||'';
  if(i==6)return (R.needs||[]).join(', ');
  if(i==7)return R.custom||(R.acts||[])[0]||'';
  return '';
}
function syncNote(){var i=C.cstep;if(!ST[i]||!ST[i].note||C.touched[i])return;var t=ftext(i);if(t&&t!==C.notes[i]){C.notes[i]=t;patch({notes:C.notes});var e=$('nt');if(e)e.value=t}}
function doneAlert(){var e=$('apop');e.innerHTML='<div class="pop-box" role="alertdialog"><p>친구가 다 했어</p><p style="font-size:16px;color:var(--mute);font-weight:400">'+esc(ST[C.cstep]?ST[C.cstep].t:'')+' 단계</p><div class="row"><button class="btn ghost" onclick="closeA()">확인</button><button class="btn" onclick="closeA();cgo(1)">다음 단계로</button></div></div>';e.hidden=false;if(navigator.vibrate)navigator.vibrate(200)}
function closeA(){var e=$('apop');e.hidden=true;e.innerHTML=''}
function crender(){
  var n=ST.length+1,i=C.cstep,s=ST[i];syncNote();var o='<div class="shell"><aside class="side"><div id="live">'+live()+'</div>'
   +'<details class="card pd"'+(C.popOpen?' open':'')+' ontoggle="C.popOpen=this.open"><summary>팝업 메시지 보내기</summary><div class="chips">'+PRE.map(function(x,k){return '<button class="chip" onclick="popPre('+k+')">'+x+'</button>'}).join('')+'</div><input type="text" id="pd" placeholder="직접 입력" value="'+esc(C.draft)+'" oninput="C.draft=this.value"><div class="row"><button class="btn" onclick="popSend()">팝업 띄우기</button><button class="btn ghost" onclick="popClose()">팝업 닫기</button></div></details>'
   +'<ol class="stepper">'+ST.map(function(x,k){return '<li><button class="stp'+(k==i?' cur':k<i?' pass':'')+'" onclick="jump('+k+')"><b>'+(k+1)+'</b>'+x.t+'</button></li>'}).join('')+'<li><button class="stp'+(i==ST.length?' cur':'')+'" onclick="jump('+ST.length+')"><b>✓</b>기록</button></li></ol></aside><section class="main"><div class="bar">';
  for(var k=0;k<n;k++)o+='<i class="'+(k<=i?'on':'')+'"></i>';
  o+='</div>';
  if(i<ST.length){
    o+='<div class="card"><span class="tag">'+(i+1)+' / '+ST.length+'</span><h1>'+s.t+'</h1><p class="sub">'+s.act+'</p>'+(s.q?'<p class="lab">친구 화면에 바로 떠 있어요</p><div class="say sent auto">'+esc(s.q)+'</div>':'')+(s.say.length?'<p class="lab">'+(s.bank?'질문을 눌러 친구 화면에 띄우기':'이렇게 말해요')+'</p>':'')+s.say.map(function(x,k){var t=fill(x);return s.bank?'<button class="say'+(C.msg===t?' sent':'')+'" onclick="send('+k+')">'+esc(t)+'</button>':'<div class="say">'+esc(t)+'</div>'}).join('');
    if(C.msg)o+='<button class="btn ghost" onclick="clr()">친구 화면에서 지우기</button>';
    if(s.note)o+='<p class="lab">기록 ('+s.note+')'+(i>=1&&i<=7?' · 친구가 적는 대로 채워져요':'')+'</p><textarea id="nt" class="sm" oninput="C.notes['+i+']=this.value;C.touched['+i+']=true;patch({notes:C.notes})">'+esc(C.notes[i])+'</textarea>';
    if(s.crisis){o+='<button class="btn ghost" onclick="C.crisis=!C.crisis;patch({crisis:C.crisis});crender()">'+(C.crisis?'✓ ':'')+'죽음·자해 얘기가 나왔어요</button>';
      if(C.crisis)o+='<div class="crisis"><b>지금 할 일</b><ul><li>혼자 두지 않기</li><li>직접 묻기: “혹시 죽고 싶다는 생각까지 들어?”</li><li>비밀로 해주겠다고 약속하지 않기</li><li>자살예방상담전화 109(24시간)를 같이 연결하기</li><li>당장 위험하면 112 또는 119</li><li>가족이나 믿을 만한 어른에게 알리기</li></ul></div>'}
    if(s.date)o+='<p class="lab">다시 연락할 날</p><input type="date" value="'+C.date+'" oninput="C.date=this.value;patch({date:C.date})">';
    o+='</div><div class="nav"><div class="row">'+(i>0?'<button class="btn ghost" onclick="cgo(-1)">이전</button>':'')+'<button class="btn" onclick="cgo(1)">'+(i==ST.length-1?'기록 보기':'다음')+'</button></div></div>';
  }else{
    o+='<div class="card"><h1>상담 기록</h1><div class="sum">';
    ST.forEach(function(s,k){if(s.note&&C.notes[k])o+='<div><small>'+s.t+'</small>'+esc(C.notes[k])+'</div>'});
    o+='<div><small>다시 연락할 날</small>'+(C.date||'—')+'</div></div>'+(C.crisis?'<div class="crisis">죽음·자해 얘기가 있었어요. 109에 연결했는지, 믿을 사람에게 알렸는지 확인하세요.</div>':'')
     +'<button class="btn ghost" onclick="cpRec()">기록 복사</button><button class="btn" onclick="done()">완료 (데이터 지우기)</button></div><div class="nav"><div class="row"><button class="btn ghost" onclick="cgo(-1)">이전</button></div></div>';
  }
  $('app').innerHTML=o+'</section></div>'+FOOT;
}
function cp(){var l=location.origin+'/';if(navigator.clipboard)navigator.clipboard.writeText(l).catch(function(){})}
function recText(){var t='';ST.forEach(function(s,k){if(s.note&&C.notes[k])t+='['+s.t+'] '+C.notes[k]+'\n'});t+='[친구가 적은 것]\n있었던 일: '+(R.what||'')+'\n기분: '+(R.feel||'')+' '+((R.moods||[]).map(strip).join(', '))+' ('+(R.level==null?5:R.level)+'/10)\n떠오른 생각: '+(R.think||'')+'\n필요한 것: '+((R.needs||[]).join(', '))+'\n오늘 해볼 것: '+(R.custom||(R.acts||[])[0]||'')+'\n다시 연락할 날: '+(C.date||'');return t}
function cpRec(){if(navigator.clipboard)navigator.clipboard.writeText(recText()).catch(function(){})}
function done(){if(confirm('완료하면 이 상담의 기록과 친구 화면이 모두 지워져요. 필요하면 먼저 기록을 복사하세요. 완료할까요?'))fetch('/api/reset?k='+encodeURIComponent(key),{method:'POST'})}
crender();
var rev=null;connect(function(d,first){var was=R.fdone;R=d;var r=d.rev||0;if(first){rev=r;C.cstep=d.cstep||0;C.msg=d.msg||'';C.notes=d.notes||{};C.crisis=!!d.crisis;C.date=d.date||'';crender()}else if(r!==rev){rev=r;pend={};C={cstep:0,msg:'',notes:{},crisis:false,date:'',draft:'',popid:0,popOpen:C.popOpen,touched:{}};closeA();crender();scrollTo(0,0)}else{var e=$('live');if(e)e.innerHTML=live();syncNote();if(!was&&d.fdone&&C.cstep>=1&&C.cstep<=7)doneAlert()}});

</script>
</body>
</html>
