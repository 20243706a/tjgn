<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상담">
<meta name="theme-color" content="#2E6B6F">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>상담</title>
</head>
<body>
<button id="fs" class="fs" hidden></button>
<main id="app"></main>
<script src="/common.js"></script>
<script>
var MOODS=['😟 불안','😢 슬픔','😠 화남','🫥 외로움','😮‍💨 지침','😤 답답함','😶 무기력','🥺 서운함','😰 걱정','😳 당황','😊 기쁨','😌 평온'];
var NEEDS=['그냥 들어주기','공감받기','조언 듣기','혼자만의 시간','쉬기','함께 있어주기','인정받기','안전하다는 느낌'];
var ACTS=['물 마시고 숨 크게 쉬기 3번','10분 걷기','오늘 일찍 자기','믿는 사람에게 말하기','할 일 하나만 줄이기','좋아하는 음악 듣기','일주일 뒤에 다시 얘기하기'];
var AG=['맞아','조금 달라','아니야'];
var LISTS={moods:MOODS,needs:NEEDS,acts:ACTS,agree:AG};
var HD=[['잠시만 기다려 줘',''],['어떤 일이 있었어?','생각나는 대로 편하게 적어.'],['그때 기분이 어땠어?','느낀 걸 적고, 해당되는 걸 눌러도 돼.'],['그 기분이 얼마나 컸어?','0은 거의 없음, 10은 가장 큼.'],['조금 더 생각해 보자','떠오르는 게 있으면 적어도 돼.'],['이야기한 게 맞아?',''],['지금 필요한 건?','여러 개 골라도 돼.'],['오늘 해볼 것','하나 골라 봐.'],['정리','']];
function nf(){return {what:'',feel:'',moods:[],level:5,needs:[],acts:[],custom:'',think:'',agree:[],fdone:false}}
var F=nf(),D={cstep:0,msg:'',pop:'',popid:0},ackId=0;
function fsave(k){var o={};o[k]=F[k];patch(o)}
function fpick(k,i,single){var a=F[k],v=LISTS[k][i],p=a.indexOf(v);if(p>-1)a.splice(p,1);else{if(single)a.length=0;a.push(v)}fsave(k);inputs()}
function chips(k,single){return '<div class="chips">'+LISTS[k].map(function(x,i){return '<button class="chip'+(F[k].indexOf(x)>-1?' sel':'')+'" onclick="fpick(\''+k+'\','+i+','+(single?1:0)+')">'+x+'</button>'}).join('')+'</div>'}
function dn(){F.fdone=!F.fdone;fsave('fdone');inputs()}
function ta(k,cls){return '<textarea class="'+cls+'" oninput="F.'+k+'=this.value;fsave(\''+k+'\')">'+esc(F[k])+'</textarea>'}
function showMsg(){$('msg').innerHTML=D.msg?'<div class="big">'+esc(D.msg)+'</div>':''}
function showPop(){var e=$('pop');if(D.pop&&D.popid!==ackId){e.innerHTML='<div class="pop-box" role="alertdialog"><p>'+esc(D.pop)+'</p><button class="btn" onclick="ack()">확인</button></div>';e.hidden=false}else{e.hidden=true;e.innerHTML=''}}
function ack(){ackId=D.popid;patch({popack:D.popid});showPop()}
function inputs(){
  var s=D.cstep,h=HD[s]||HD[0],o='<h1>'+h[0]+'</h1>'+(h[1]?'<p class="sub">'+h[1]+'</p>':'');
  if(s==1)o+=ta('what','');
  else if(s==2)o+=ta('feel','sm')+chips('moods');
  else if(s==3)o+='<p class="num" id="lv">'+F.level+'</p><input type="range" min="0" max="10" value="'+F.level+'" oninput="F.level=+this.value;$(\'lv\').textContent=F.level;fsave(\'level\')">';
  else if(s==4)o+=ta('think','sm');
  else if(s==5)o+=chips('agree',1);
  else if(s==6)o+=chips('needs');
  else if(s==7)o+=chips('acts',1)+'<input type="text" placeholder="직접 적기 (선택)" value="'+esc(F.custom)+'" oninput="F.custom=this.value;fsave(\'custom\')">';
  else if(s==8)o+='<div class="sum"><div><small>있었던 일</small>'+(esc(F.what)||'—')+'</div><div><small>그때 기분</small>'+(esc(F.feel)||'—')+(F.moods.length?'\n'+F.moods.map(strip).join(', '):'')+' (크기 '+F.level+'/10)</div><div><small>지금 필요한 것</small>'+(F.needs.join(', ')||'—')+'</div><div><small>오늘 해볼 것</small>'+(esc(F.custom||F.acts[0])||'—')+'</div></div>';
  if(s>=1&&s<=7)o+='<button class="btn'+(F.fdone?'':' ghost')+'" onclick="dn()">'+(F.fdone?'✓ 다 했어':'다 했어')+'</button>';
  $('in').innerHTML=o;
}
$('app').innerHTML='<div id="pop" class="pop" hidden></div><div id="msg"></div><div id="in" class="card"><p class="sub">연결하는 중...</p></div>'+FOOT;
var rev=null,KEYS=['what','feel','moods','level','needs','acts','custom','think','agree'];
connect(function(d,first){
  var r=d.rev||0,st=d.cstep||0,redo=false;
  if(first){rev=r;KEYS.forEach(function(k){if(d[k]!=null)F[k]=d[k]});F.fdone=!!d.fdone;ackId=d.popack||0;redo=true}
  else if(r!==rev){rev=r;pend={};F=nf();ackId=0;redo=true}
  else if(st!==D.cstep){F.fdone=!!d.fdone;redo=true}
  D.cstep=st;if(redo){scrollTo(0,0);inputs()}
  D.msg=d.msg||'';showMsg();D.pop=d.pop||'';D.popid=d.popid||0;showPop();
});

</script>
</body>
</html>
